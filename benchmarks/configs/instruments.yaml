# Every benchmark the suite knows. To add one (say a moral judgment task with human norms):
#   1. Make benchmarks/<name>/__init__.py with an Instrument subclass, and items.jsonl with sources in its _meta line.
#   2. Optionally add benchmarks/<name>/norms.yaml. Reports then show human norms beside each arm.
#   3. Add an entry here. Add contrasts to contrasts.yaml if it's part of the pre-registered test.
# role: main = the result we care about. guardrail = must not move.
instruments:
  holt_laury:
    class: benchmarks.holt_laury:HoltLaury
    role: main
    transfer: far
    norms: holt_laury/norms.yaml
  lotteries:
    class: benchmarks.lotteries:Lotteries
    role: main
    transfer: far
    norms: lotteries/norms.yaml
  mid_travel:
    class: benchmarks.mid_travel:MidTravel
    role: main
    transfer: mid
  near_errand:
    class: benchmarks.near_errand:NearErrand
    role: main
    transfer: near
  ifeval:
    class: benchmarks.guardrails:IFEval
    role: guardrail
  mmlu:
    class: benchmarks.guardrails:MMLU
    role: guardrail
