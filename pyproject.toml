# Project metadata, the main .venv's pinned dependencies, and lint settings.
# The three Python environments and why they stay separate: docs/ENVIRONMENTS.md.

[project]
name = "kokopelli"
version = "0.0.0"
description = "Simulated people in a painted city: life generator, agents, world-model loop."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-vlm==0.7.11",
    "opencv-python==5.0.0.93",
]

[tool.uv]
# Not an installable package: modules run from the repo root with `python -m`.
package = false
# MLX only runs on Apple silicon, and this repo only runs on this Mac.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Transitive versions held to what the main .venv had on 2026-11-09, so a fresh
# `uv sync` rebuilds the environment the tests passed on. Drop a line to let it float.
constraint-dependencies = [
    "click==8.5.0",
    "datasets==5.1.0",
    "fastapi==0.162.0",
    "filelock==4.2.7",
    "fsspec==2026.7.0",
    "miniaudio==1.71",
    "mlx-audio==0.6.4",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "pydantic==2.14.2",
    "pydantic-core==2.50.2",
    "regex==2026.9.29",
    "sentencepiece==0.2.2",
    "transformers==5.22.1",
    "typer==0.27.3",
    "typing-inspection==0.4.4",
    "xxhash==4.0.2",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [
    "simworld",
    "wm_multicontrol/upstream",
    "mac_server",
    "out",
    "models",
    ".venv",
    ".claude",
]

[tool.ruff.per-file-target-version]
# These run under simworld/.venv, which is Python 3.10.
"runtime/adapters/simworld*.py" = "py310"
"runtime/tests/test_simworld*.py" = "py310"
"city/ue/build_city.py" = "py310"

[tool.ruff.lint]
# Syntax errors, pyflakes, bugbear, pyupgrade. No formatter and no repo-wide autofix:
# existing findings are baselined below, per file, so new code is held to the rules.
select = ["E9", "F", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
