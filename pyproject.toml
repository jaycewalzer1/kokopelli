# Project metadata, the main .venv's pinned dependencies, and lint settings.
# The three Python environments and why they stay separate: docs/ENVIRONMENTS.md.

[project]
name = "kokopelli"
version = "0.0.0"
description = "Simulated people in a painted city: life generator, agents, world-model loop."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-vlm==0.7.11",
    "opencv-python==5.0.0.93",
]

[project.scripts]
# The same entry points as `python -m <module>`. The transfer and filter commands only run in the Cosmos venv.
koko-gpu = "kokopelli.ops.gpu:main"
koko-ram = "kokopelli.ops.ram_share:main"
koko-memguard = "kokopelli.ops.memguard:main"
koko-panel = "kokopelli.life.panel:main"
koko-video-check = "kokopelli.wm.video_check:main"
koko-transfer = "kokopelli.wm.world_transfer:main"
koko-transfer-multi = "kokopelli.wm.world_transfer_multi:main"
koko-filter = "kokopelli.wm.world_filter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the library is installed. experiments/, tools/ and tests/ run from the repo root.
packages = ["kokopelli"]

[tool.uv]
# The library is installed editable (`uv pip install --no-deps -e .`) in .venv and the Cosmos venv, so `import kokopelli`
# works from any folder. Everything also still runs from the repo root with `python -m`.
package = true
# MLX only runs on Apple silicon, and this repo only runs on this Mac.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Transitive versions held to what the main .venv had on 2026-11-09, so a fresh
# `uv sync` rebuilds the environment the tests passed on. Drop a line to let it float.
constraint-dependencies = [
    "click==8.5.0",
    "datasets==5.1.0",
    "fastapi==0.162.0",
    "filelock==4.2.7",
    "fsspec==2026.7.0",
    "miniaudio==1.71",
    "mlx-audio==0.6.4",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "pydantic==2.14.2",
    "pydantic-core==2.50.2",
    "regex==2026.9.29",
    "sentencepiece==0.2.2",
    "transformers==5.22.1",
    "typer==0.27.3",
    "typing-inspection==0.4.4",
    "xxhash==4.0.2",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [
    "simworld",
    "vendor/wm_multicontrol_upstream",
    "mac_server",
    "out",
    "models",
    ".venv",
    ".claude",
]

[tool.ruff.per-file-target-version]
# These run under simworld/.venv, which is Python 3.10.
"kokopelli/loop/adapters/simworld*.py" = "py310"
"kokopelli/loop/tests/test_simworld*.py" = "py310"
"tools/city_build/build_city.py" = "py310"

[tool.ruff.lint]
# Syntax errors, pyflakes, bugbear, pyupgrade. No formatter and no repo-wide autofix:
# existing findings are baselined below, per file, so new code is held to the rules.
select = ["E9", "F", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"experiments/benchmarks/*.py" = ["UP017"]  # also run on PACE in a venv whose Python isn't recorded here; datetime.UTC needs 3.11, timezone.utc works on 3.10
# BASELINE (generated 2026-11-09, P2-D): existing findings, not fixed in this pass.
# Remove a code from a file once its findings there are fixed. Counts: docs/fable_log/P2-D.md.
# Added 2026-11-10 when the commons and exp1 branches were merged, same rule: baselined, not fixed.
"experiments/commons/prompts.py" = ["UP031"]
"experiments/commons/run.py" = ["UP031"]
"tools/bodies/metahuman/make_bodies.py" = ["B008"]
"tools/bodies/standins/import_standins.py" = ["F841"]
"tools/bodies/standins/make_groom_usda.py" = ["UP031"]
"tools/bodies/wave1_renders.py" = ["UP031"]
"tools/bodies/wave2_renders.py" = ["F841", "UP031"]
"tools/city_build/kinds/california_modern.py" = ["F841"]
"tools/city_build/kinds/glass_houses.py" = ["F841"]
"tools/city_build/kinds/handmade.py" = ["F841"]
"tools/city_build/kinds/japanese_homes.py" = ["F841"]
"tools/city_build/kinds/mcm_housing.py" = ["F841"]
"tools/city_build/kinds/norcal_modern.py" = ["F841"]
"tools/city_build/plan_varied/kitmap.py" = ["UP031"]
"tools/city_build/plan_varied/plan.py" = ["F841"]
"kokopelli/life/overnight.py" = ["B904"]
"kokopelli/life/scenario_night.py" = ["B904"]
"kokopelli/loop/interfaces.py" = ["B027"]
"kokopelli/loop/tests/test_simworld_actions.py" = ["B904"]
"kokopelli/loop/tests/test_simworld_adapter.py" = ["B904"]
"kokopelli/loop/tests/test_simworld_contract.py" = ["B904"]
"kokopelli/loop/tests/test_simworld_gate.py" = ["B904"]
"kokopelli/loop/tests/test_simworld_recovery.py" = ["B904"]
"tests/test_life_pipeline.py" = ["UP031"]

[tool.pyright]
include = ["core", "ops", "runtime"]
exclude = ["**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
