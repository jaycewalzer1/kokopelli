# Project metadata, the main .venv's pinned dependencies, and lint settings.
# The three Python environments and why they stay separate: docs/ENVIRONMENTS.md.

[project]
name = "kokopelli"
version = "0.0.0"
description = "Simulated people in a painted city: life generator, agents, world-model loop."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-vlm==0.7.11",
    "opencv-python==5.0.0.93",
]

[dependency-groups]
# Checks only, nothing at run time; installed with `uv pip install`, never `uv sync`. The test runner for the main .venv
# (the SimWorld venv has the same version), and import-linter: `lint-imports` enforces [tool.importlinter] below (also a
# pre-commit hook).
dev = [
    "import-linter==2.16",
    "pytest==9.2.0",
]

[project.scripts]
# The same entry points as `python -m <module>`. The transfer and filter commands only run in the Cosmos venv.
koko-gpu = "kokopelli.ops.gpu:main"
koko-ram = "kokopelli.ops.ram_share:main"
koko-memguard = "kokopelli.ops.memguard:main"
koko-panel = "kokopelli.life.panel:main"
koko-video-check = "kokopelli.wm.video_check:main"
koko-transfer = "kokopelli.wm.world_transfer:main"
koko-transfer-multi = "kokopelli.wm.world_transfer_multi:main"
koko-filter = "kokopelli.wm.world_filter:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the library is installed. experiments/, tools/ and tests/ run from the repo root.
packages = ["kokopelli"]

[tool.uv]
# The library is installed editable (`uv pip install --no-deps -e .`) in .venv and the Cosmos venv, so `import kokopelli`
# works from any folder. Everything also still runs from the repo root with `python -m`.
package = true
# MLX only runs on Apple silicon, and this repo only runs on this Mac.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Transitive versions held to what the main .venv had on 2026-11-09, so a fresh
# `uv sync` rebuilds the environment the tests passed on. Drop a line to let it float.
constraint-dependencies = [
    "click==8.5.0",
    "datasets==5.1.0",
    "fastapi==0.162.0",
    "filelock==4.2.7",
    "fsspec==2026.7.0",
    "miniaudio==1.71",
    "mlx-audio==0.6.4",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "pydantic==2.14.2",
    "pydantic-core==2.50.2",
    "regex==2026.9.29",
    "sentencepiece==0.2.2",
    "transformers==5.22.1",
    "typer==0.27.3",
    "typing-inspection==0.4.4",
    "xxhash==4.0.2",
]

[tool.pytest.ini_options]
# `make test-all` runs these twice: .venv with -m "not py310", simworld/.venv with -m py310 (tools/fable/test_all.sh).
# The markers are applied and enforced in conftest.py. mac_server/tests has its own pytest.ini and runs with MAC=1.
testpaths = ["tests", "experiments/benchmarks/tests", "experiments/commons/tests", "experiments/exp1/tests",
             "experiments/homeostatic/tests"]
# The repo root on sys.path, and experiments/ (no __init__.py) resolved as a namespace package, so every test module
# imports under its full dotted name (tests.loop.test_x, experiments.benchmarks.tests.test_y) and nothing is loaded twice.
pythonpath = ["."]
consider_namespace_packages = true
addopts = ["-p", "no:cacheprovider"]
markers = [
    "model: loads Qwen or Cosmos onto the GPU; skipped unless RUN_MODEL_TESTS is set (queue it through kokopelli/ops/gpu.py)",
    "py310: needs simworld/.venv (Python 3.10, unrealcv); the SimWorld tests",
    "unreal: needs a running Unreal server",
    "slow: takes hours; skipped unless RUN_LONG_TESTS is set",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [
    "simworld",
    "vendor/wm_multicontrol_upstream",
    "mac_server",
    "out",
    "models",
    ".venv",
    ".claude",
]

[tool.ruff.per-file-target-version]
# These run under simworld/.venv, which is Python 3.10.
"kokopelli/loop/adapters/simworld*.py" = "py310"
"tests/loop/test_simworld*.py" = "py310"
"conftest.py" = "py310"  # the SimWorld test run loads it too
"tools/city_build/build_city.py" = "py310"

[tool.ruff.lint]
# Syntax errors, pyflakes, bugbear, pyupgrade. No formatter. The 2026-11-09 baseline of per-file ignores was
# burned down in reorg phase 8; the few findings kept have a `# noqa` with a reason on their line.
select = ["E9", "F", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Every line needs a reason.
"experiments/benchmarks/*.py" = ["UP017"]  # also run on PACE in a venv whose Python isn't recorded here; datetime.UTC needs 3.11, timezone.utc works on 3.10

[tool.importlinter]
# The import wall, checked by `lint-imports` from the repo root (pre-commit runs it too). The library is kokopelli/;
# experiments/, tools/ and tests/ may import it, never the other way. An exception is one ignore_imports line with a
# comment saying why, and only where moving the code would change behaviour. Edges: tools/reorg/import_graph.py.
# experiments, tools and tests are scanned too (namespace packages), so an allowed edge can name the exact module.
root_packages = ["kokopelli", "experiments", "tools", "tests"]

[[tool.importlinter.contracts]]
name = "The library never imports experiments, tools or tests"
type = "forbidden"
source_modules = ["kokopelli"]
forbidden_modules = ["experiments", "tools", "tests"]
ignore_imports = [
    # The dev panel serves the Experiment 1 page; its reader needs exp1's world and homeostasis code, which is the experiment itself.
    "kokopelli.life.panel -> experiments.exp1.panel",
]

[[tool.importlinter.contracts]]
# Low to high: wm (world model) <- mind <- loop <- life <- agents. life sits above loop: it holds the dev panel and the
# life generator, which read runs; the loop reaches life only through its life_db adapter (allowed below).
name = "Layers: wm, mind, loop, life, agents (a lower layer never imports a higher one)"
type = "layers"
layers = [
    "kokopelli.agents",
    "kokopelli.life",
    "kokopelli.loop",
    "kokopelli.mind",
    "kokopelli.wm",
]
ignore_imports = [
    # The loop's adapter that feeds it a life from the life generator's database: an adapter's whole job is that edge.
    "kokopelli.loop.adapters.life_db -> kokopelli.life.*",
]

[[tool.importlinter.contracts]]
# The system python3 runs gpu.py, memguard.py and ram_share.py with no venv (docs/REORG_EXECUTION.md section 3, rule 9).
name = "ops imports nothing else from the library, settings included"
type = "forbidden"
source_modules = ["kokopelli.ops"]
forbidden_modules = ["kokopelli.wm", "kokopelli.mind", "kokopelli.loop", "kokopelli.life", "kokopelli.agents", "kokopelli.settings"]

[tool.pyright]
# The library only: experiments/ and tools/ stay unchecked, and so do tests (phase 7 moves the ones still under
# kokopelli/ into tests/). Third-party packages that live in other venvs (cosmos3_mlx in the Cosmos venv, unrealcv in
# simworld/.venv) are stubbed under typings/, pyright's default stubPath, so no home path goes in this file.
include = ["kokopelli"]
exclude = ["**/__pycache__", "**/tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# The typings/ stubs have no source on purpose; without this every stubbed import is a warning.
reportMissingModuleSource = "none"
