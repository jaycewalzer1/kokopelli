# Checks only: nothing here reformats code (there is no formatter; see pyproject.toml). The 2026-11-09 baselines
# were burned down in reorg phase 8; what is still allowed has a reason next to it, in the file or below.
#
#   uvx pre-commit install              # once: lint on every commit, `make test-all` before every push
#   uvx pre-commit run --all-files      # whole repo, commit-stage hooks; wrap in kokopelli/ops/memguard.py run
default_install_hook_types: [pre-commit, pre-push]
exclude: ^(simworld/|vendor/wm_multicontrol_upstream/|mac_server/Binaries/|\.venv/|out/|models/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        stages: [pre-commit]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: shellcheck
        stages: [pre-commit]
        # -x follows the files a script sources (the PACE batch scripts source tools/pace/env.sh).
        args: [-x]
        exclude: ^mac_server/scripts/relaunch\.sh$
      - id: shellcheck
        name: shellcheck (mac_server/scripts/relaunch.sh)
        stages: [pre-commit]
        # mac_server/ is the snapshot of the Mac SimWorld server and isn't edited outside its own work; this script's
        # one finding (SC2012, ls in a pipe) stays until then.
        args: [-e, "SC2012"]
        files: ^mac_server/scripts/relaunch\.sh$

  - repo: local
    hooks:
      - id: biome
        name: biome lint (kokopelli/life/static)
        language: system
        stages: [pre-commit]
        entry: npx -y @biomejs/biome@2.6.6 lint --no-errors-on-unmatched
        files: ^kokopelli/life/static/.*\.js$
      - id: lint-imports
        name: import contracts (lint-imports, [tool.importlinter] in pyproject.toml)
        language: system
        # The main .venv has import-linter (dev group). It reads the whole graph, so it runs once, not per file.
        entry: .venv/bin/lint-imports
        pass_filenames: false
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
        # These lack a final newline on purpose: import_standins.json is written by the Unreal script, inspector.js
        # and the mac_server files are left as they are, and experiments/commons/results/ holds results a report
        # cites, which are never rewritten.
        exclude: ^(tools/bodies/standins/import_standins\.json|kokopelli/life/static/inspector\.js|mac_server/SimWorld\.uproject|mac_server/Tools/look/realism_means\.json|experiments/commons/results/)

  - repo: local
    hooks:
      - id: test-all
        name: make test-all (every suite, through memguard)
        language: system
        entry: make test-all
        pass_filenames: false
        always_run: true
        stages: [pre-push]
