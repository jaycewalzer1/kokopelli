# Lint, type-check and the tests that need neither MLX nor Unreal. Written in reorg phase 8 for the layout after
# phases 3 and 7 (tests under tests/, pytest, [tool.importlinter]) and not run yet: it can only be checked once main
# is pushed. macOS on Apple silicon, because uv.lock only resolves for darwin/arm64 ([tool.uv] in pyproject.toml).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: ruff (pinned to the pre-commit version)
        run: uvx ruff@0.11.4 check .

      - name: install the main environment and the dev tools
        # pyright reads third-party types from .venv; cosmos3_mlx and unrealcv are stubbed under typings/.
        # The two tools are the [dependency-groups] dev pins in pyproject.toml.
        run: |
          uv sync --frozen
          uv pip install --python .venv/bin/python import-linter==2.16 pytest==9.2.0

      - name: pyright on the library
        run: uvx pyright kokopelli

      - name: import contracts
        run: |
          if grep -q '^\[tool.importlinter\]' pyproject.toml; then
            .venv/bin/lint-imports
          else
            echo "no [tool.importlinter] in pyproject.toml; skipped"
          fi

  tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: install the main environment and pytest
        run: |
          uv sync --frozen
          uv pip install --python .venv/bin/python pytest==9.2.0
      - name: ops tests (standard library only)
        # Not through tools/fable/test_all.sh: it also starts a py310 run in simworld/.venv, which CI doesn't have.
        # The other tests load MLX or need simworld/.venv and the Unreal server.
        run: .venv/bin/python -W ignore -m pytest -q -rfE -m "not py310" tests/ops
