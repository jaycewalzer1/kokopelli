<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System architecture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Work+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/static/design.css">
<link rel="stylesheet" href="/static/panel.css">
<link rel="stylesheet" href="/static/architecture.css">
</head>
<body>
<nav class="sidebar" aria-label="Views">
  <div class="wordmark">Kokopelli</div>
  <a href="/">Life generator</a>
  <a href="/training">Homeostatic training</a>
  <a href="/architecture" aria-current="page">System architecture</a>
  <a href="/queue">GPU queue</a>
  <a href="/worlds">World model runs</a>
  <a href="/moodboard">City moodboard</a>
</nav>
<div class="view">
<header>
  <div class="brand">System architecture</div>
  <div id="status-line" role="status"><i></i><span id="status-text">Loading</span></div>
</header>
<div class="page architecture">
  <main class="architecture-main">
    <div class="key" id="kind-key" aria-label="What each shape means"></div>
    <div class="key" aria-label="How to read the chart">
      <span><svg width="28" height="14" aria-hidden="true"><rect class="box s-built" x=".5" y=".5" width="27" height="13"/></svg>Built</span>
      <span><svg width="28" height="14" aria-hidden="true"><rect class="box s-partial" x=".5" y=".5" width="27" height="13"/></svg>Partly built</span>
      <span><svg width="28" height="14" aria-hidden="true"><rect class="box s-unproven" x=".5" y=".5" width="27" height="13"/><rect class="inner" x="3.5" y="3.5" width="21" height="7"/></svg>Runs, not working yet</span>
      <span><svg width="28" height="14" aria-hidden="true"><rect class="box s-planned" x=".5" y=".5" width="27" height="13"/></svg>Planned, no code</span>
      <span><svg width="28" height="14" aria-hidden="true"><g class="edge active"><path class="edge-line" d="M0 7H28"/><path class="edge-flow" d="M0 7H28"/></g></svg>In use now</span>
      <span><svg width="14" height="14" aria-hidden="true"><rect class="token" x="4" y="4" width="6" height="6"/></svg>One new log row</span>
      <span>Still means idle or not built.</span>
    </div>
    <figure id="chart">
      <svg id="diagram" role="img" aria-label="The whole system as a chart. Each part is marked built, partly built, not working yet or planned. Lines move only where a running process is really using that path."></svg>
      <figcaption id="chart-note" hidden>On a narrow screen only links between neighbors are drawn. Choose a part to see all of its links.</figcaption>
    </figure>
  </main>
  <aside aria-label="Details">
    <div id="inspector"></div>
  </aside>
</div>
</div>
<script type="module" src="/static/architecture.js"></script>
</body>
</html>
