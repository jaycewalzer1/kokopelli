[pytest]
markers =
    m0: handshake, framing, vget/vset on objects, camera png
    m1: prefab spawning and city generation (placeholder meshes OK)
    m2: humanoid agent (Base_User_Agent) movement, camera, UE manager
    m3: vehicles, pedestrians, traffic signals, traffic controller
    m4: depth / object_mask / bmp / file captures, weather manager
    m5: actions (sit, pick up, vehicles, scooter, gestures, robot dog, paths)
    should: behavior recommended by SPEC but not strictly required by the client
addopts = -ra
