; SimWorld Mac server — engine config.
; Template_Default is an engine map so the server can be smoke-tested before any SimWorld content exists.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Templates/Template_Default.Template_Default
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GlobalDefaultGameMode=/Script/Engine.GameModeBase

[/Script/MacTargetPlatform.MacTargetSettings]
; Apple Silicon only. SM6 is needed for Nanite/VSM on newer engine versions; SM5 kept as fallback.
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6
+TargetedRHIs=SF_METAL_SM5

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.RendererSettings]
; Lumen with software ray tracing only (Metal has no hardware-RT requirement this way).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.RayTracing=False
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.AllowStaticLighting=False
r.SkinCache.CompileShaders=True
; Custom depth + stencil, available for future segmentation passes.
r.CustomDepth=3
r.DefaultFeature.AutoExposure=True

[/Script/Engine.Engine]
bSmoothFrameRate=False

[Core.Log]
LogSimCV=Log
